name: InstaBox watchdog

on:
  schedule:
    # Backend moved off InstaBox to the VPS 43.173.48.186 on 2026-11-17, so
    # nothing needs waking any more; this only checks both public hostnames.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check both Cloudflare Tunnel hostnames
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            https://duel.artivy.id/healthz \
            https://artiverse.artivy.id/healthz
          do
            response="$({
              curl --fail --silent --show-error \
                --retry 3 --retry-delay 2 --retry-all-errors \
                --connect-timeout 10 --max-time 30 \
                "$endpoint"
            })"
            test "$response" = "ok"
          done
