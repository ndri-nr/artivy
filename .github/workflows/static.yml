# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The game pages are grouped under games/ in the repo for tidiness, but
      # every shipped app has /artivy/<game>/privacy-policy.html hard-coded in
      # its binary. Flatten them back to the root so the published URLs never
      # move. Deleting this step 404s the legal links in five released games.
      # A play page and its script are separate files with separate cache lifetimes, so a
      # browser can hold a new play.html beside a play.js from the previous deploy. When a
      # change spans both — a button removed from the HTML that the old script still reaches
      # for at boot — that pair throws and the game is a blank board. Safari holds it longest.
      #
      # Stamping the commit time into the asset URLs makes the pair inseparable: whichever
      # page a browser has, it asks for the assets that shipped with it. Done here rather than
      # by hand because a version you have to remember to bump is one you will forget on the
      # deploy that needed it.
      - name: Stamp the asset version
        run: |
          STAMP=$(git log -1 --format=%ct)
          grep -rl '?v=BUILD' games | xargs -r sed -i "s/?v=BUILD/?v=$STAMP/g"
          echo "stamped v=$STAMP"
          ! grep -rq '?v=BUILD' games
      - name: Flatten games/ to the site root
        run: cp -R games/. . && rm -rf games
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
