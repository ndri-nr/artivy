<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Play StackO! in your browser. A neon slab slides in over the tower — tap to drop it, and whatever hangs over the edge is sliced away. Three modes, no account, no download.">
    <meta name="theme-color" content="#060a1c">
    <title>Play StackO! - Artivy</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/play.css?v=BUILD">
    <link rel="stylesheet" href="game.css?v=BUILD">

    <!-- AdSense, on every page as Google's setup requires. The meta tag is what links the
         site to the account; the script is what would serve an advert. Neither places one by
         itself: Auto ads are off, and the game pages take a hand-placed unit in the slot
         play.css reserves below the board. -->
    <meta name="google-adsense-account" content="ca-pub-8668013395284480">
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8668013395284480"
        crossorigin="anonymous"></script>
</head>
<!-- main.js is deliberately not loaded: it is the home page's Three.js particle field, and
     this is the one game here with a render loop of its own to compete with. -->
<body class="playing gstacko">
    <div class="play-bar">
        <a class="play-home" href="../index.html">
            <img src="../assets/logo.svg" alt="Artivy">
        </a>
        <span class="play-spacer"></span>
        <details class="play-menu">
            <summary aria-label="Games and pages">Games <span class="play-caret"></span></summary>
            <div class="play-menu-panel">
                <ul>
                    <li><a href="../pawdoku/play.html">PawDoku</a></li>
                    <li><a href="../kata_word/play.html">Kata·Word</a></li>
                    <li><a href="play.html" aria-current="page">StackO!</a></li>
                    <li><a href="../2048/play.html">2048</a></li>
                    <li><a href="../rekta/play.html">Rekta</a></li>
                    <li><a href="../pourfect/play.html">PourFect!</a></li>
                </ul>
                <ul class="play-menu-pages">
                    <li><a href="index.html">About StackO!</a></li>
                    <li><a href="privacy-policy.html">Privacy</a></li>
                    <li><a href="terms-and-conditions.html">Terms</a></li>
                    <li><a href="../about.html">About Artivy</a></li>
                    <li><a href="../contact.html">Contact</a></li>
                    <li><a href="../privacy.html">Website privacy</a></li>
                </ul>
            </div>
        </details>
    </div>

    <!--
      Side rails, desktop only. They are absolutely positioned against this wrapper rather than
      being flex items beside the stage, because the board's width is `min(..., 100%, ...)` and
      that 100% resolves against the stage — turning the stage into a content-sized flex item
      would change the number the whole board-sizing model is built on. Out of flow, it cannot.
    -->
    <div class="play-with-rails">
    <aside class="ad-rail ad-rail-left" id="rail-left" aria-label="Advertisement"></aside>
    <script>
        /*
          The <ins> is created here rather than written above, and only when the rail is wide
          enough to exist. adsbygoogle.push() does not fill the slot nearest the call — it fills
          the next uninitialised <ins> in document order. With a hidden rail left in the markup,
          the banner below the board pushed and AdSense handed that push to the hidden rail
          instead, so the rail failed on availableWidth=0 and the banner was never filled at all.
          No element, no misdirected push.
        */
        if (matchMedia('(min-width: 1024px)').matches) {
            document.getElementById('rail-left').innerHTML =
                '<ins class="adsbygoogle" style="display:block;width:160px;height:600px"'
                + ' data-ad-client="ca-pub-8668013395284480" data-ad-slot="7431283902"></ins>';
            (adsbygoogle = window.adsbygoogle || []).push({});
        }
    </script>
    <main class="play-stage" id="stage">
        <div class="play-panel">
            <div class="play-row">
                <h1 class="play-title">StackO!</h1>
                <span class="play-spacer"></span>
                <div class="stat">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">BEST</span>
                    <span class="stat-value" id="best">0</span>
                </div>
                <!-- Always here, not only on the game-over card. Closing that card used to
                     leave a finished run with nothing on screen that could start another. -->
                <button class="play-button" id="restart">New run</button>
            </div>

            <p class="play-warning" id="warning" hidden>
                This browser is not letting the page save, so your best scores will not survive
                a reload.
            </p>
        </div>

        <div class="play-board" id="board" role="application" aria-label="StackO! tower">
            <canvas id="scene"></canvas>
            <!-- The whole of this game's running commentary, on the board where the player
                 is looking rather than in the panel above it. It opens as the one instruction
                 the game needs, then becomes the block count and the streak. -->
            <p class="board-hint idle" id="hint">Tap to drop</p>
        </div>

        <!-- Ad slot, empty on purpose: no AdSense unit is placed yet. The height is reserved
             so switching one on later cannot shove the tower around. -->
        <!--
          One display unit per game, so AdSense reports which game earns what — a single unit
          shared across five pages would merge the figures, and that cannot be split later.

          The size is fixed rather than `data-ad-format="auto"`, which is what AdSense hands you
          and which lets Google choose the height at runtime. It cannot be that here: the board
          is sized `100dvh - var(--play-chrome)`, --play-chrome is a constant we declare, and it
          has exactly this 100px budgeted into it. An advert that arrived 280px tall would push
          every one of these pages off the bottom of the screen, and nothing in the layout could
          see it coming. A shorter slot earns less. A board that overflows is worse.
        -->
        <div class="play-ad" id="ad">
            <ins class="adsbygoogle"
                 style="display:block;width:100%;height:100px"
                 data-ad-client="ca-pub-8668013395284480"
                 data-ad-slot="7431283902"
                 data-ad-format="horizontal"
                 data-full-width-responsive="false"></ins>
            <script>
                /* Landscape phones hide this slot outright — there is no room for an advert
                   there that is not either over the board or under a thumb (see play.css) —
                   and pushing into a hidden container throws "No slot size for
                   availableWidth=0". Ask whether the slot has a width before filling it. */
                if (document.getElementById('ad').offsetWidth > 0) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            </script>
        </div>
    </main>
    <aside class="ad-rail ad-rail-right" id="rail-right" aria-label="Advertisement"></aside>
    <script>
        /*
          The <ins> is created here rather than written above, and only when the rail is wide
          enough to exist. adsbygoogle.push() does not fill the slot nearest the call — it fills
          the next uninitialised <ins> in document order. With a hidden rail left in the markup,
          the banner below the board pushed and AdSense handed that push to the hidden rail
          instead, so the rail failed on availableWidth=0 and the banner was never filled at all.
          No element, no misdirected push.
        */
        if (matchMedia('(min-width: 1024px)').matches) {
            document.getElementById('rail-right').innerHTML =
                '<ins class="adsbygoogle" style="display:block;width:160px;height:600px"'
                + ' data-ad-client="ca-pub-8668013395284480" data-ad-slot="7431283902"></ins>';
            (adsbygoogle = window.adsbygoogle || []).push({});
        }
    </script>
    </div>

    <div class="sheet" id="sheet" hidden>
        <div class="sheet-card">
            <h2 id="sheet-title"></h2>
            <p id="sheet-text"></p>
            <div class="play-row">
                <button class="play-button" id="sheet-action"></button>
                <button class="play-button ghost" id="sheet-close">Close</button>
            </div>
        </div>
    </div>

    <script type="module" src="play.js?v=BUILD"></script>
</body>
</html>
