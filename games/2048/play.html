<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Play 2048 in your browser. Slide the tiles, merge equal numbers, keep going past 2048. No account, no download, progress saved on your device.">
    <link rel="canonical" href="https://artivy.id/games/2048/play.html">

    <!-- Icons. SVG first so the mark stays sharp at any size; the PNGs are for the
         places that will not take one, including Google's own search results. -->

    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
    <link rel="apple-touch-icon" href="../../assets/icon-180.png">

    <!-- What a link to this page looks like when someone shares it. Absolute URLs
         throughout: a scraper fetches these on their own and has no document to
         resolve a relative path against. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Artivy">
    <meta property="og:locale" content="en">
    <meta property="og:title" content="Play 2048">
    <meta property="og:description" content="Play 2048 in your browser. Slide the tiles, merge equal numbers, keep going past 2048. No account, no download, progress saved on your device.">
    <meta property="og:url" content="https://artivy.id/games/2048/play.html">
    <meta property="og:image" content="https://artivy.id/assets/2048-feature.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="500">
    <meta property="og:image:alt" content="2048 by Artivy">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Play 2048">
    <meta name="twitter:description" content="Play 2048 in your browser. Slide the tiles, merge equal numbers, keep going past 2048. No account, no download, progress saved on your device.">
    <meta name="twitter:image" content="https://artivy.id/assets/2048-feature.png">

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Games",
          "item": "https://artivy.id/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "2048",
          "item": "https://artivy.id/games/2048/"
        },
        {

    <meta name="theme-color" content="#15120f">
    <title>Play 2048 - Artivy</title>
    <!-- The type is on this origin now, so it is preloaded rather than discovered inside a
         stylesheet on another one. `crossorigin` is not optional even same-origin: a font is
         always fetched in CORS mode, and a preload without it fetches the file a second time
         instead of matching. Only the latin subsets are hinted — latin-ext is declared in the
         CSS and `unicode-range` keeps it unfetched until a page needs it. -->
    <link rel="preload" href="../../assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/play.css?v=BUILD">
    <link rel="stylesheet" href="game.css?v=BUILD">
</head>
<!--
  main.js is deliberately not loaded here. It runs a Three.js particle field behind the
  page, which is a continuous repaint the board would be competing with for frames.
-->
<body class="playing g2048">
    <div class="play-bar">
        <a class="play-home" href="../../index.html">
            <img src="../../assets/logo.svg" alt="Artivy" width="290" height="100" fetchpriority="high">
        </a>
        <span class="play-spacer"></span>
        <details class="play-menu">
            <summary aria-label="Games and pages">Games <span class="play-caret"></span></summary>
            <div class="play-menu-panel">
                <ul>
                    <li><a href="../pawdoku/play.html">PawDoku</a></li>
                    <li><a href="../kata_word/play.html">Kata·Word</a></li>
                    <li><a href="../stacko/play.html">StackO!</a></li>
                    <li><a href="play.html" aria-current="page">2048</a></li>
                    <li><a href="../rekta/play.html">Rekta</a></li>
                    <li><a href="../pourfect/play.html">PourFect!</a></li>
                </ul>
                <ul class="play-menu-pages">
                    <li><a href="index.html">About 2048</a></li>
                    <li><a href="privacy-policy.html">Privacy</a></li>
                    <li><a href="terms-and-conditions.html">Terms</a></li>
                    <li><a href="../../about.html">About Artivy</a></li>
                    <li><a href="../../contact.html">Contact</a></li>
                    <li><a href="../../privacy.html">Website privacy</a></li>
                </ul>
            </div>
        </details>
    </div>

    <!--
      Side rails, desktop only. They are absolutely positioned against this wrapper rather than
      being flex items beside the stage, because the board's width is `min(..., 100%, ...)` and
      that 100% resolves against the stage — turning the stage into a content-sized flex item
      would change the number the whole board-sizing model is built on. Out of flow, it cannot.
    -->
    <div class="play-with-rails">
    <main class="play-stage" id="stage">
        <div class="play-panel">
            <div class="play-row">
                <h1 class="play-title">2048</h1>
                <span class="play-spacer"></span>
                <div class="score-card">
                    <span class="score-label">SCORE</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-card">
                    <span class="score-label">BEST</span>
                    <span class="score-value" id="best">0</span>
                </div>
            </div>

            <div class="play-row">
                <button class="play-button" id="new">New game</button>
                <button class="play-button" id="undo" disabled>Undo</button>
            </div>

            <p class="play-hint" id="hint">Swipe, or use the arrow keys.</p>
            <p class="play-warning" id="warning" hidden>
                This browser is not letting the page save, so this run will not survive a reload.
            </p>
        </div>

        <!--
          The board is a sibling of the panel, not a child of it. On a landscape phone the
          stage turns into a row and the two sit side by side, which is only possible if
          they are siblings.
        -->
        <div class="play-board" id="board" role="application" aria-label="2048 board" tabindex="0">
            <div class="overlay" id="overlay" hidden>
                <h2 id="overlay-title"></h2>
                <p id="overlay-text"></p>
                <ol class="scores" id="overlay-scores"></ol>
                <div class="play-row">
                    <button class="play-button" id="overlay-primary"></button>
                    <button class="play-button ghost" id="overlay-secondary" hidden></button>
                </div>
            </div>
        </div>
    </main>
    </div>

    <script type="module" src="play.js?v=BUILD"></script>
</body>
</html>
