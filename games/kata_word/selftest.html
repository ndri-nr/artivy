<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- A developer harness, not a page. It is thin by nature and would only ever
         dilute the site in a search index. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Kata·Word self-check</title>
    <style>
        body { font: 14px/1.6 ui-monospace, monospace; padding: 24px; background: #12151a; color: #eef2f6; }
        h1 { font-size: 1rem; margin: 0 0 12px 0; }
        h2 { font-size: 0.8rem; margin: 16px 0 4px 0; color: #9aa7b4; font-weight: 600; }
        .pass { color: #6aaa64; }
        .fail { color: #ff8f7a; font-weight: 700; }
        .note { color: #9aa7b4; }
        #summary { margin-top: 16px; font-weight: 700; }
    </style>
</head>
<!--
  Open this page and read it. It covers the two things that would quietly ruin a game:
  duplicate-letter scoring, and the word lists keeping the subset relation the game assumes.

  Paths resolve against the published layout (games/ flattened to the site root), so serve
  the flattened copy — see the preview one-liner in the workspace CLAUDE.md.
-->
<body>
    <h1>Kata·Word self-check</h1>
    <div id="out"></div>
    <div id="summary">running…</div>

    <script type="module">
        import {
            LANGUAGES, MAX_GUESSES, WORD_LENGTHS,
            evaluateGuess, loadList, mergeKeyboard, pickWord,
        } from './model.js';

        const out = document.getElementById('out');
        let failures = 0;

        function section(title) {
            const line = document.createElement('h2');
            line.textContent = title;
            out.appendChild(line);
        }

        function check(name, condition, detail = '') {
            const line = document.createElement('div');
            line.className = condition ? 'pass' : 'fail';
            line.textContent = `${condition ? 'ok  ' : 'FAIL'} ${name}`
                + (detail && !condition ? ` — ${detail}` : '');
            out.appendChild(line);
            if (!condition) failures++;
        }

        function note(text) {
            const line = document.createElement('div');
            line.className = 'note';
            line.textContent = `    ${text}`;
            out.appendChild(line);
        }

        const score = (guess, answer) =>
            evaluateGuess(guess, answer).map((s) => s[0]).join('');

        /* --- scoring, and duplicate letters in particular --- */

        section('scoring');

        check('all correct', score('kasa', 'kasa') === 'cccc', score('kasa', 'kasa'));
        check('all absent', score('bcdf', 'gjkl') === 'aaaa', score('bcdf', 'gjkl'));
        check('a misplaced letter is present', score('acbd', 'abcd') === 'cppc',
            score('acbd', 'abcd'));

        // The one everybody gets wrong. Only one s in the answer, and the green takes it, so
        // the other s in the guess has nothing left to match.
        check('a duplicate does not double-count against a single answer letter',
            score('sasa', 'kasa') === 'accc', score('sasa', 'kasa'));
        check('the green claims its letter before any yellow can',
            score('aabb', 'bbaa') === 'pppp', score('aabb', 'bbaa'));
        check('an extra copy beyond the answer\'s count goes grey',
            score('sssa', 'kasa') === 'aacc', score('sssa', 'kasa'));
        check('two copies both count when the answer has two',
            score('abab', 'baab') === 'ppcc', score('abab', 'baab'));

        /* --- keyboard colours --- */

        section('keyboard');

        const keys = {};
        mergeKeyboard(keys, 'sasa', evaluateGuess('sasa', 'kasa'));
        check('a scored guess colours its keys', keys.a === 'correct' && keys.s === 'correct');

        const downgrade = { a: 'correct' };
        mergeKeyboard(downgrade, 'aaaa', ['absent', 'absent', 'absent', 'absent']);
        check('a key is never downgraded once it is green', downgrade.a === 'correct');

        const upgrade = { b: 'absent' };
        mergeKeyboard(upgrade, 'bbbb', ['present', 'absent', 'absent', 'absent']);
        check('a key is upgraded when a later guess does better', upgrade.b === 'present');

        /* --- drawing a word --- */

        section('drawing a word');

        const pool = ['alpha', 'bravo', 'delta', 'gamma'];
        check('a draw comes from the pool', pool.includes(pickWord(pool, 7)));
        check('a recently played word is avoided',
            pickWord(pool, 0, new Set(['alpha'])) !== 'alpha');
        check('an exhausted pool still returns a word rather than spinning',
            pool.includes(pickWord(pool, 3, new Set(pool))));

        /* --- the word lists themselves --- */

        section('word lists');

        let subsetFaults = 0;
        let lengthFaults = 0;
        let emptyLists = 0;
        const sizes = [];

        for (const { code } of LANGUAGES) {
            for (const size of WORD_LENGTHS) {
                const [answers, guesses] = await Promise.all([
                    loadList(code, 'answers', size),
                    loadList(code, 'guesses', size),
                ]);

                if (answers.length === 0 || guesses.length === 0) {
                    emptyLists++;
                    continue;
                }
                sizes.push(`${code}/${size}: ${answers.length} answers, ${guesses.length} guesses`);

                for (const word of [...answers, ...guesses]) {
                    if (word.length !== size || !/^[a-z]+$/.test(word)) lengthFaults++;
                }

                // The game draws its solution from answers and validates typed guesses against
                // guesses. Break the subset relation and it can set a word whose own solution
                // it refuses to accept.
                const guessSet = new Set(guesses);
                for (const word of answers) if (!guessSet.has(word)) subsetFaults++;
            }
        }

        check('every list has words in it', emptyLists === 0, `${emptyLists} empty`);
        check('every word is the right length and plain lower-case letters', lengthFaults === 0,
            `${lengthFaults} bad entries`);
        check('every answer is also an accepted guess', subsetFaults === 0,
            `${subsetFaults} words break the subset`);
        for (const line of sizes) note(line);

        /* --- a real word, end to end --- */

        section('end to end');

        const idAnswers = await loadList('id', 'answers', 5);
        const word = pickWord(idAnswers, 12345);
        check('a five-letter Indonesian word can be drawn', !!word && word.length === 5,
            String(word));
        note(`id/5 drew "${word}"`);
        check('and it can be solved against itself', score(word, word) === 'ccccc',
            score(word, word));
        check('and it is a word the game would accept',
            (await loadList('id', 'guesses', 5)).includes(word) || idAnswers.includes(word));
        check('six guesses is the board', MAX_GUESSES === 6);

        const summary = document.getElementById('summary');
        const checks = out.querySelectorAll('.pass, .fail').length;
        summary.className = failures === 0 ? 'pass' : 'fail';
        summary.textContent = failures === 0
            ? `all ${checks} checks passed`
            : `${failures} of ${checks} checks FAILED`;
    </script>
</body>
</html>
