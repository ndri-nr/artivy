<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Artivy">
  <title>Artivy</title>
  <!--
    The mark on its own — square, so it fits a favicon, an avatar or an app tile. Same geometry
    as the mark half of logo.svg, copied rather than referenced: this file is meant to be loaded
    through <img>, and an <img>-rendered SVG cannot fetch anything external, so a
    <use href="logo.svg#mark"> would resolve to nothing. Change the A here and in logo.svg
    together, or the two drift apart.

    The A is painted through a mask: white first, then a plain yellow band over it. Drawn as a
    separate crossbar stroke the yellow either overshot the legs or floated short of them,
    because a straight cap cannot meet a slanted edge cleanly at both corners. Through the mask
    its ends follow the silhouette exactly.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa14a"/>
      <stop offset="0.5" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#7048e8"/>
    </linearGradient>
    <mask id="amask">
      <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M26 79 50 21l24 58"/>
        <path d="M35 62h30"/>
      </g>
    </mask>
  </defs>

  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#tile)"/>
  <g mask="url(#amask)">
    <rect x="6" y="6" width="88" height="88" fill="#fff"/>
    <rect x="6" y="57.5" width="88" height="9" fill="#feca57"/>
  </g>
</svg>
