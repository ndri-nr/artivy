<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>PourFect!</title>
  <defs>
    <linearGradient id="pourfect-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7FE0"/>
      <stop offset="1" stop-color="#2B4C9B"/>
    </linearGradient>
    <!-- The glass, so the liquid can be clipped to it rather than drawn to fit by hand. -->
    <clipPath id="pourfect-glass">
      <path d="M38 26 h32 v46 a16 16 0 0 1 -32 0 z"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="100" height="100" rx="24" fill="url(#pourfect-tile)"/>
  <!-- A tube part filled, the way the app's own mark draws it: red under amber under green,
       with the top third still glass. -->
  <g clip-path="url(#pourfect-glass)">
    <rect x="36" y="26" width="36" height="62" fill="#FFFFFF" opacity="0.16"/>
    <rect x="36" y="70" width="36" height="20" fill="#E0564F"/>
    <rect x="36" y="55" width="36" height="15" fill="#DFA63B"/>
    <rect x="36" y="44" width="36" height="11" fill="#3FA76B"/>
  </g>
  <path d="M38 26 h32 v46 a16 16 0 0 1 -32 0 z" fill="none" stroke="#FFFFFF" stroke-width="6"
        stroke-linejoin="round"/>
  <rect x="44" y="34" width="5" height="30" rx="2.5" fill="#FFFFFF" opacity="0.55"/>
</svg>
